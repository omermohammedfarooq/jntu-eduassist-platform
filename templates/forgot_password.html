{% extends "base.html" %}

{% block title %}Forgot Password - JNTU EduAssist{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">RESET PASSWORD</h1>
            <p class="auth-subtitle">Enter your email to receive reset instructions</p>
        </div>

        <form method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
            <div class="form-group">
                <label for="email" class="form-label">EMAIL ADDRESS</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="Enter your registered email"
                    required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">SEND RESET LINK</button>

            <div class="auth-switch">
                Remember your password? <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </form>
    </div>
</div>

<style>
    .auth-container {
        max-width: 500px;
        margin: 4rem auto;
        padding: 3rem;
        background: var(--bg-secondary);
        border: 1px solid var(--border);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .auth-title {
        font-size: 24px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 0.5rem;
    }

    .auth-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
    }

    .auth-form {
        margin-top: 2rem;
    }

    .btn-full {
        width: 100%;
        margin-top: 2rem;
    }

    .auth-switch {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 14px;
        color: var(--text-secondary);
    }

    .auth-switch a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
    }

    .auth-switch a:hover {
        text-decoration: underline;
    }

    @media (max-width: 768px) {
        .auth-container {
            padding: 2rem 1.5rem;
        }
    }
</style>
{% endblock %}
