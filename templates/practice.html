{% extends "base.html" %}

{% block title %}Practice Questions - JNTU EduAssist{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>PRACTICE QUESTIONS</h1>
        <p>Generate practice questions to test your knowledge</p>
    </div>

    <div class="practice-container">
        <div class="practice-form">
            <h3>SELECT YOUR COURSE</h3>

            <form id="practiceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="degree" class="form-label">DEGREE</label>
                        <select id="degree" name="degree" class="form-select" required>
                            <option value="">Select Degree</option>
                            <option value="btech">B.Tech</option>
                            <option value="mtech">M.Tech</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="branch" class="form-label">BRANCH</label>
                        <select id="branch" name="branch" class="form-select" required>
                            <option value="">Select Branch</option>
                            <option value="cse">Computer Science & Engineering</option>
                            <option value="ece">Electronics & Communication</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="year" class="form-label">YEAR</label>
                        <select id="year" name="year" class="form-select" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester" class="form-label">SEMESTER</label>
                        <select id="semester" name="semester" class="form-select" required>
                            <option value="">Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full">GENERATE QUESTIONS</button>
            </form>
        </div>

        <div id="questionsDisplay" class="questions-display"></div>
    </div>
</div>

<style>
    .practice-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .practice-form {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        padding: 2rem;
        margin-bottom: 2rem;
    }

    .practice-form h3 {
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 2rem;
    }

    .questions-display {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        padding: 2rem;
        min-height: 200px;
    }
</style>
{% endblock %}
